[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "work-memory"
version = "0.1.0"
description = "Local-first Windows desktop memory assistant for creative work."
requires-python = ">=3.11"
dependencies = [
    "PySide6",
    "watchdog",
    "sounddevice",
    "faster-whisper",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
